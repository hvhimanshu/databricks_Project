# This is a Declarative Automation Bundle definition for databricks_project_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_project_bundle
  uuid: 0d1cea8d-4663-41ea-906f-f8864430118f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-96107a7f-ec60.cloud.databricks.com
    variables:
      catalog: demo_dev
      schema: dev
      warehouse_id: 22ca2efe37040e3e
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-96107a7f-ec60.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/hvhimanshu9@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/PROD_databricks_Project
    variables:
      catalog: demo_prod
      schema: prod
      warehouse_id: 22ca2efe37040e3e
    permissions:
      - user_name: hvhimanshu9@gmail.com
        level: CAN_MANAGE
