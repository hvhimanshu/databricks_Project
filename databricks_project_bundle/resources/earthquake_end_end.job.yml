resources:
  jobs:
    databricks_earthquack_end_end_job:
      name: databricks_earthquack_end_end_job
      tasks:
        - task_key: ingestion_bronze
          notebook_task:
            notebook_path: ../src/notebooks/ingestion_bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: bronze_silver_earthquake
          depends_on:
            - task_key: ingestion_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.databricks_project_bundle_etl.id}
        - task_key: EarthQuake_Dashboard
          depends_on:
            - task_key: bronze_silver_earthquake
          dashboard_task:
            subscription: {}
            warehouse_id: 22ca2efe37040e3e
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
